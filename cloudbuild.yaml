steps:
  - name: 'gcr.io/cloud-builders/git'
    entrypoint: 'bash'
    args: ['-c', 'git clone https://github.com/WiswaPillai/test.git']
 
  - name: 'gcr.io/cloud-builders/ssh'
    env:
      - 'EC2_KEY'
    entrypoint: 'bash'
    args:
      - -c
      - |
        echo "$EC2_KEY" > ec2_key.pem
        chmod 600 ec2_key.pem
        ssh -i ec2_key.pem -o StrictHostKeyChecking=no gcpuser@3.111.188.92 '
          cd /var/www/app &&
          git pull origin main &&
          docker-compose up -d --build
        '

availableSecrets:
  secretManager:
    - versionName: projects/common-tools-265603/secrets/aws-ec2-private-key/versions/latest
      env: EC2_KEY

options:
  logging: CLOUD_LOGGING_ONLY




  