steps:
  - name: 'gcr.io/cloud-builders/git'
    entrypoint: 'bash'
    args: ['-c', 'git clone https://github.com/WiswaPillai/test.git']

  - name: 'gcr.io/cloud-builders/npm'
    dir: 'test'
    args: ['install']

  - name: 'ubuntu'
    secretEnv: ['aws-ec2-private-key']
    entrypoint: 'bash'
    args:
      - -c
      - |
        apt-get update && apt-get install -y openssh-client

        echo "$aws-ec2-private-key" > ec2_key.pem
        chmod 600 ec2_key.pem

        # Copy project files to EC2'
        echo 'Copying files to EC2 instance...'
        scp -i ec2_key.pem -o StrictHostKeyChecking=no -r test gcpuser@3.111.188.92:/home/gcpuser/app
        echo 'Files copied to EC2 instance.'

        ssh -i ec2_key.pem -o StrictHostKeyChecking=no gcpuser@3.111.188.92 '
          git pull origin main &&
          docker-compose up -d --build
          echo "Deployment completed successfully."
        exit 0
        '

availableSecrets:
  secretManager:
    - versionName: projects/common-tools-265603/secrets/aws-ec2-private-key/versions/latest
      env: aws-ec2-private-key

options:
  logging: CLOUD_LOGGING_ONLY
