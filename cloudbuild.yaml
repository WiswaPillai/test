steps:
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "$$EC2_KEY" > id_rsa
        chmod 600 id_rsa
        ssh -o StrictHostKeyChecking=no -i id_rsa gcpuser@3-111-188-92 '
          cd /var/www/app &&
          git pull origin main &&
          docker-compose up -d --build
        '

availableSecrets:
  secretManager:
    - versionName: projects/common-tools-265603/secrets/aws-ec2-private-key/versions/latest
      env: EC2_KEY

options:
  logging: CLOUD_LOGGING_ONLY
